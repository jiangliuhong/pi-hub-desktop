[package]
name = "pi-hub-desktop"
version = "0.1.3"
description = "Pi Hub Client — macOS / iOS client for Pi Hub"
authors = ["jiangliuhong"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin crate on Windows.
name = "pi_hub_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri runtime (core requirement, §3 tech stack) ---
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# --- Serialization across the Tauri boundary (§11 data model) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Async runtime + cancellation (§5.3 lifecycle, §8 forward) ---
# Justification: SSH session, forward accept loop and keepalive are inherently
# async and need cooperative cancellation. The std library has no async runtime.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "process",
] }
tokio-util = { version = "0.7", features = ["rt"] } # CancellationToken

# --- Domain primitives ---
# Justification: §11 requires stable UUID service ids; timestamps for
# created_at/updated_at; typed URLs for base_url; async trait objects for the
# provider/credential abstractions; structured typed errors (§19); structured
# redacted logging (§20). None of these are provided by std.
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"
tracing = { version = "0.1", features = ["attributes"] }

# --- SSH client + direct-tcpip (§7 SSH rules) ---
# Justification: §3 mandates `russh` for the SSH client and `direct-tcpip`.
# russh is a pure-Rust async SSH implementation; it builds and tests on Linux
# (used for the integration test suite in §12.2) and supports the Apple targets.
russh = "0.51"
# russh now ships its own key handling (`russh::keys`); used for Ed25519/RSA
# private-key decoding and host-key public-key serialization.

# --- Host-key fingerprint + base64 wire encoding (§6.3, §9) ---
# Justification: §9 requires SHA-256 fingerprints and OpenSSH wire-format
# serialization for known-host comparison. Pulled explicitly rather than
# reaching into russh internals.
sha2 = "0.10"
base64 = "0.22"

# --- V2 local runtime domain (docs/design-v2.md §19) ---
# Justification: parsing + comparing Node / Pi Hub / Pi CLI versions and the
# npm-style `engines.node` range (design-v2 §5, §6). std has no semver parser.
# Builds on all targets incl. `aarch64-apple-ios` and the iOS simulator.
semver = "1"
# Justification: sending SIGTERM / SIGKILL to a managed *process group* on
# macOS (design-v2 §11.7, AGENTS.md §6.6). std `Child::kill` only targets the
# direct child; POSIX `killpg` is required to clean up the Next.js subtree.
# Wrapped in a single platform module (design-v2 §11.7); never used in the
# business layer. Minimal, ubiquitous crate; no unsafe spread.
libc = "0.2"

# --- Apple Keychain (§6.1 credential security) ---
# Justification: credentials must be stored in Apple Security Framework on
# macOS and iOS; std and the existing dependencies do not expose Keychain APIs.
# Scoped to Darwin targets so non-Apple test builds remain portable.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7"

# --- V3 package management (docs/requirements-v3.md §9) ---
# Justification: the ReleaseClient must query the npm registry over HTTPS
# with real certificate-chain validation (V3-SR-004: HTTPS + system trust,
# never ignore cert errors). The V2 health probe is loopback-only (no TLS),
# and std provides no HTTPS client. `reqwest` is the standard async HTTP
# client; `rustls-tls` keeps it pure-Rust (no OpenSSL system dep) so it
# builds and tests on Linux dev hosts while validating real cert chains.
# Gated to non-iOS: V3 package management is macOS-only and iOS returns
# `unsupported_platform` for every command (requirements-v3 §4.2), so the iOS
# build must not pull in an HTTP/TLS stack.
[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros"] }
tempfile = "3"
# Used only in tests to generate throwaway Ed25519 keys for fingerprint /
# comparison assertions; never used with real user keys.
rand = "0.8"
